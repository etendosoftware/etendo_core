def platformContextDirectory = layout.buildDirectory.dir('platform-context-source')
tasks.register('generatePlatformContext') {
    def original = file('../src/org/openbravo/dal/core/OBContext.java')
    inputs.file(original)
    outputs.dir(platformContextDirectory)
    doLast {
        boolean excluded = false
        int regions = 0
        def lines = []
        original.readLines().each { line ->
            if (line.trim() == '// ERP-COMPAT-BEGIN') {
                if (excluded) throw new GradleException('Nested ERP context marker')
                excluded = true
                regions++
            } else if (line.trim() == '// ERP-COMPAT-END') {
                if (!excluded) throw new GradleException('Unmatched ERP context marker')
                excluded = false
            } else if (!excluded) { lines.add(line) }
        }
        if (excluded || regions != 7) throw new GradleException('Unexpected ERP context regions')
        def source = lines.join('\n') + '\n'
        if (source.contains('Warehouse') || source.contains('ErpContextSupport')) {
            throw new GradleException('ERP types leaked into platform context')
        }
        def target = new File(platformContextDirectory.get().asFile, 'org/openbravo/dal/core/OBContext.java')
        target.parentFile.mkdirs()
        target.text = source
    }
}

tasks.named('compileDalJava', JavaCompile) {
    dependsOn 'generatePlatformContext'
    source platformContextDirectory
    dependsOn 'verifySecurityGeneration'
    options.sourcepath = files('../src', '../src-core/src', 'build/security-generated-entities')
    options.compilerArgs += ['-implicit:class', '-Xmaxerrs', '300']
}

tasks.named('compileClassicEntitiesJava', JavaCompile) {
    source fileTree('../src') { include 'org/openbravo/base/model/domaintype/*.java' }
    source fileTree('../src') {
        include 'org/openbravo/dal/service/OBDal.java'
        include 'org/openbravo/dal/core/DalMappingGenerator.java'
        include 'org/openbravo/dal/core/DalSessionFactoryController.java'
        include 'com/etendoerp/sequences/services/*.java'
    }
    source fileTree('../modules_core/org.openbravo.userinterface.selector/src') { include '**/domaintype/*.java' }
    options.sourcepath = files('../src', '../src-core/src', '../src-gen')
    options.compilerArgs += ['-implicit:class', '-Xmaxerrs', '30']
}

tasks.named('compileClassicJsonJava', JavaCompile) {
    dependsOn 'prepareClassicCompatibility'
    classpath += files('build/classic-compatibility/WEB-INF/classes')
    classpath += fileTree('build/classic-compatibility/WEB-INF/lib') { include '*.jar' }
    options.sourcepath = files()
    options.compilerArgs += ['-implicit:none', '-Xmaxerrs', '40']
}

tasks.register('prepareClassicCompatibility', Sync) {
    into layout.buildDirectory.dir('classic-compatibility')
    from(provider {
        if (!project.hasProperty('classicWar')) {
            throw new GradleException('Supply -PclassicWar=/absolute/path/to/classic.war for legacy support classes')
        }
        zipTree(file(project.property('classicWar')))
    }) {
        include 'WEB-INF/classes/**'
        include 'WEB-INF/lib/*.jar'
        exclude '**/*.properties'
    }
}

tasks.named('processDalResources') {
    dependsOn 'verifySecurityGeneration'
}

tasks.register('verifySharedCoreIntegration') {
    group = 'verification'
    description = 'Reject duplicate shared-core classes in validation runtime outputs.'
    dependsOn 'compileDalJava', 'compileClassicEntitiesJava', ':platform-core:check'
    doLast {
        def relativeClass = 'org/openbravo/dal/security/ReadableScopeResolver.class'
        ['bootstrap', 'dal', 'classicEntities'].each { name ->
            sourceSets[name].output.classesDirs.files.each { directory ->
                if (new File(directory, relativeClass).exists()) {
                    throw new GradleException("Shared core was compiled twice: ${directory}/${relativeClass}")
                }
            }
        }
        logger.lifecycle('PASS: Minimal and Classic compilation use the shared-core artifact without local duplicates')
    }
}

tasks.register('verifyContextApi') {
    group = 'verification'
    description = 'Preserve OBContext public/protected declarations and JVM descriptors against Classic.'
    dependsOn 'prepareClassicCompatibility', 'compileClassicEntitiesJava'
    doLast {
        def relativeClass = 'org/openbravo/dal/core/OBContext.class'
        def baseline = layout.buildDirectory.file("classic-compatibility/WEB-INF/classes/${relativeClass}").get().asFile
        def candidate = layout.buildDirectory.file("classes/java/classicEntities/${relativeClass}").get().asFile
        def declarations = { File classFile ->
            if (!classFile.isFile()) throw new GradleException("Missing API class: ${classFile}")
            def output = new ByteArrayOutputStream()
            exec {
                commandLine new File(System.getProperty('java.home'), 'bin/javap').absolutePath,
                        '-protected', '-s', classFile.absolutePath
                standardOutput = output
            }
            def entries = new LinkedHashSet<String>()
            String declaration = null
            output.toString('UTF-8').readLines().each { raw ->
                def line = raw.trim()
                if (line.startsWith('public ') || line.startsWith('protected ')) {
                    declaration = line
                    if (line.endsWith('{')) entries.add(line)
                } else if (line.startsWith('descriptor:') && declaration != null) {
                    entries.add(declaration + ' ' + line)
                    declaration = null
                }
            }
            if (entries.size() < 10) throw new GradleException('Incomplete OBContext API inspection')
            entries
        }
        def before = declarations(baseline)
        def after = declarations(candidate)
        def missing = before - after
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        file(project.property('classicWar')).withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        def report = layout.buildDirectory.file('context-api-result.txt').get().asFile
        report.text = "Baseline WAR SHA-256: ${digest.digest().encodeHex()}\n" +
                "Baseline declarations: ${before.size()}\n" +
                "Missing or changed declarations: ${missing.size()}\n" + missing.join('\n') + '\n'
        if (!missing.isEmpty()) throw new GradleException("OBContext API changed; inspect ${report}")
        logger.lifecycle("PASS: All ${before.size()} baseline OBContext API declarations and descriptors preserved")
    }
}

tasks.named('compileBootstrapJava', JavaCompile) {
    options.sourcepath = files('../src', '../src-core/src')
    options.compilerArgs += ['-implicit:class']
}

def dbsmJar = providers.gradleProperty('dbsmJar').map { file(it) }.orElse(provider {
    def artifacts = fileTree(new File(gradle.gradleUserHomeDir,
            'caches/modules-2/files-2.1/com.etendoerp/dbsm/1.2.0')) {
        include '**/dbsm-1.2.0.jar'
    }.files
    if (artifacts.size() != 1) {
        throw new GradleException('Supply -PdbsmJar=/absolute/path/dbsm-1.2.0.jar')
    }
    artifacts.first()
})

