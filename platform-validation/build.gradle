    classpath += sourceSets.bootstrap.output + sourceSets.web.output
    from(sourceSets.dal.output) {
        into 'WEB-INF/classes'
        exclude 'com/etendoerp/platform/validation/**'
    }
    from('fixtures/log4j2.xml') { into 'WEB-INF/classes' }
}

tasks.register('platformWar') { dependsOn war }

tasks.register('runErpUi', JavaExec) {
    group = 'application'
    description = 'Start existing ERP UI against a verified owned Classic database copy.'
    dependsOn 'erpUiWar', tomcatProbeClasses
    classpath = sourceSets.tomcatProbe.runtimeClasspath + configurations.erpUiContainerRuntime
    systemProperty 'validation.jspEnabled', 'true'
    mainClass = 'com.etendoerp.platform.validation.ErpUiServer'
    workingDir = projectDir
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED'
    doFirst {
        args file('build/libs/platform-erp-ui.war').absolutePath,
                file(project.property('copyProperties')).absolutePath,
                (project.findProperty('platformPort') ?: '8093')
    }
}

tasks.register('runPlatform', JavaExec) {
    group = 'application'
    description = 'Run a minimal platform WAR against retained fixture configuration.'
    def ui = providers.gradleProperty('platformUi').orElse('false').get() == 'true'
    dependsOn ui ? 'platformUiWar' : 'platformWar'
    dependsOn tomcatProbeClasses
    classpath = sourceSets.tomcatProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.CompatibilityServer'
    workingDir = projectDir
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED'
    doFirst {
        args file(ui ? 'build/libs/platform-ui.war' : 'build/libs/platform-validation.war').absolutePath,
                file(project.property('platformProperties')).absolutePath,
                (project.findProperty('platformPort') ?: '8091'), '/platform'
    }
}

tasks.register('platformUiWar', Zip) {
    group = 'build'
    description = 'Add optional application UI assets to the unchanged minimal REST backend.'
    dependsOn war
    archiveFileName = 'platform-ui.war'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(provider { zipTree(tasks.war.archiveFile.get().asFile) })
    from('ui') { exclude 'INDEX.md' }
}

tasks.register('verifyProfilePackaging') {
    group = 'verification'
    description = 'Verify UI assets are optional and backend bytes are identical.'
    dependsOn 'platformUiWar'
    doLast {
        def rest = new java.util.zip.ZipFile(tasks.war.archiveFile.get().asFile)
        def ui = new java.util.zip.ZipFile(tasks.platformUiWar.archiveFile.get().asFile)
        try {
            ['index.html', 'requests.js', 'requests.css'].each { name ->
                if (rest.getEntry(name) != null || ui.getEntry(name) == null) {
                    throw new GradleException("Optional UI packaging failed: ${name}")
                }
            }
            rest.entries().each { entry ->
                if (!entry.directory) {
                    def matching = ui.getEntry(entry.name)
                    if (matching == null || !java.util.Arrays.equals(rest.getInputStream(entry).bytes, ui.getInputStream(matching).bytes)) {
                        throw new GradleException("Backend differs between profiles: ${entry.name}")
                    }
                }
            }
        } finally { rest.close(); ui.close() }
        logger.lifecycle('PASS: Optional UI assets; identical backend bytes in both platform WARs')
    }
}

