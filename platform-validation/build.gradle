plugins {
    id 'java'
    id 'war'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main.java.srcDirs = ['src']

// Compile the actual dictionary bootstrap separately from the ERP application.
sourceSets {
    classicEntities {
        java.srcDirs = ['../src-gen']
        resources {
            srcDir '../modules_core/org.openbravo.userinterface.selector/src'
            include '**/domaintype/*.hbm.xml'
        }
    }
    classicProbe {
        java.srcDirs = ['classic-probe']
    }
    classicGenerated {
        java.srcDirs = ['build/classic-generated-entities']
        resources {
            srcDir 'build/classic-generated-entities'
            include 'META-INF/services/*'
        }
    }
    web {
        java.srcDirs = ['web']
    }
    tomcatProbe {
        java.srcDirs = ['tomcat-probe']
    }
    bootstrap {
        java {
            srcDir '../src'
            include 'org/openbravo/base/model/ModelProvider.java'
            include 'org/openbravo/base/model/domaintype/TableDirDomainType.java'
            include 'org/openbravo/base/model/domaintype/BooleanDomainType.java'
            include 'org/openbravo/base/model/domaintype/DatetimeDomainType.java'
            include 'org/openbravo/base/model/domaintype/StringEnumerateDomainType.java'
            include 'org/openbravo/base/model/domaintype/TableDomainType.java'
            include 'org/openbravo/base/session/DalUUIDGenerator.java'
            include 'org/openbravo/base/gen/GenerateEntitiesTask.java'
        }
        resources {
            srcDir '../src'
            include 'org/openbravo/base/model/*.hbm.xml'
            include 'org/openbravo/base/gen/*.ftl'
            include 'com/etendoerp/sequences/model/*.hbm.xml'
            include 'org/openbravo/dal/core/template*.hbm.xml'
        }
    }
    dictionaryProbe {
        java.srcDirs = ['dictionary-probe']
        compileClasspath += sourceSets.main.output + sourceSets.bootstrap.output
        runtimeClasspath += sourceSets.main.output + sourceSets.bootstrap.output
    }
    dal {
        java {
            srcDir '../src'
            srcDir 'build/security-generated-entities'
            srcDir 'dal-probe'
            include 'DalMappingValidation.java'
            include 'org/openbravo/dal/service/OBDal.java'
            include 'org/openbravo/dal/core/DalMappingGenerator.java'
            include 'org/openbravo/dal/core/DalSessionFactoryController.java'
            include 'com/etendoerp/sequences/services/*.java'
            include 'org/openbravo/model/**/*.java'
            include 'org/openbravo/client/application/*.java'
            include 'com/etendoerp/platform/fixture/*.java'
        }
        compileClasspath += sourceSets.bootstrap.output
        runtimeClasspath += sourceSets.bootstrap.output
        resources {
            srcDir 'build/security-generated-entities'
            include 'META-INF/services/*'
        }
    }
}

sourceSets.web.compileClasspath += sourceSets.bootstrap.output + sourceSets.dal.output
sourceSets.classicEntities.compileClasspath += sourceSets.bootstrap.output
sourceSets.classicProbe.compileClasspath += sourceSets.bootstrap.output + sourceSets.classicEntities.output
sourceSets.classicProbe.runtimeClasspath += sourceSets.classicEntities.output + sourceSets.bootstrap.output
configurations.classicEntitiesImplementation.extendsFrom(configurations.bootstrapImplementation)
configurations.classicProbeImplementation.extendsFrom(configurations.bootstrapImplementation)
configurations.classicProbeRuntimeOnly.extendsFrom(configurations.bootstrapRuntimeOnly)
configurations.classicProbeImplementation.extendsFrom(configurations.classicEntitiesImplementation)
configurations.classicGeneratedImplementation.extendsFrom(configurations.classicEntitiesImplementation)
sourceSets.classicGenerated.compileClasspath += sourceSets.bootstrap.output + sourceSets.classicEntities.output
configurations.bootstrapImplementation.extendsFrom(configurations.implementation)
configurations.bootstrapRuntimeOnly.extendsFrom(configurations.runtimeOnly)
configurations.dictionaryProbeImplementation.extendsFrom(configurations.bootstrapImplementation)
configurations.dictionaryProbeRuntimeOnly.extendsFrom(configurations.bootstrapRuntimeOnly)
configurations.dalImplementation.extendsFrom(configurations.bootstrapImplementation)
configurations.dalRuntimeOnly.extendsFrom(configurations.bootstrapRuntimeOnly)
configurations.webImplementation.extendsFrom(configurations.dalImplementation)

tasks.named('compileDalJava', JavaCompile) {
    dependsOn 'verifySecurityGeneration'
    options.sourcepath = files('../src', '../src-core/src', 'build/security-generated-entities')
    options.compilerArgs += ['-implicit:class', '-Xmaxerrs', '300']
}

tasks.named('compileClassicEntitiesJava', JavaCompile) {
    source fileTree('../src') { include 'org/openbravo/base/model/domaintype/*.java' }
    source fileTree('../src') {
        include 'org/openbravo/dal/service/OBDal.java'
        include 'org/openbravo/dal/core/DalMappingGenerator.java'
        include 'org/openbravo/dal/core/DalSessionFactoryController.java'
        include 'com/etendoerp/sequences/services/*.java'
    }
    source fileTree('../modules_core/org.openbravo.userinterface.selector/src') { include '**/domaintype/*.java' }
    options.sourcepath = files('../src', '../src-core/src', '../src-gen')
    options.compilerArgs += ['-implicit:class', '-Xmaxerrs', '30']
}

tasks.named('processDalResources') {
    dependsOn 'verifySecurityGeneration'
}

tasks.named('compileBootstrapJava', JavaCompile) {
    options.sourcepath = files('../src', '../src-core/src')
    options.compilerArgs += ['-implicit:class']
}

def dbsmJar = providers.gradleProperty('dbsmJar').map { file(it) }.orElse(provider {
    def artifacts = fileTree(new File(gradle.gradleUserHomeDir,
            'caches/modules-2/files-2.1/com.etendoerp/dbsm/1.2.0')) {
        include '**/dbsm-1.2.0.jar'
    }.files
    if (artifacts.size() != 1) {
        throw new GradleException('Supply -PdbsmJar=/absolute/path/dbsm-1.2.0.jar')
    }
    artifacts.first()
})

dependencies {
    classicEntitiesImplementation 'io.smallrye:jandex:3.1.2'
    classicEntitiesImplementation 'org.codehaus.jettison:jettison:1.5.4'
    classicEntitiesImplementation 'commons-codec:commons-codec:1.17.1'
    tomcatProbeImplementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.59'
    tomcatProbeImplementation 'org.apache.tomcat.embed:tomcat-embed-jasper:10.1.59'
    dalImplementation 'io.smallrye:jandex:3.1.2'
    implementation files(dbsmJar)
    implementation 'org.hibernate.orm:hibernate-core:6.5.2.Final'
    implementation 'org.postgresql:postgresql:42.7.8'
    implementation 'commons-betwixt:commons-betwixt:0.8'
    implementation 'commons-beanutils:commons-beanutils:1.9.4'
    implementation 'commons-digester:commons-digester:2.1'
    implementation 'commons-dbcp:commons-dbcp:1.4'
    implementation 'commons-pool:commons-pool:1.5.6'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'oro:oro:2.0.8'
    implementation 'org.apache.ant:ant:1.9.2'
    implementation 'org.apache.logging.log4j:log4j-1.2-api:2.25.2'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.25.2'
    bootstrapImplementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'
    bootstrapImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    bootstrapImplementation 'org.dom4j:dom4j:2.2.0'
    bootstrapImplementation 'org.apache.commons:commons-text:1.10.0'
    bootstrapImplementation 'org.freemarker:freemarker:2.3.34'
    bootstrapImplementation 'org.redisson:redisson:3.52.0'
}

tasks.named('war', War) {
    group = 'build'
    description = 'Package the real generated DAL and validation HTTP application as a WAR.'
    dependsOn dalClasses, webClasses
    archiveFileName = 'platform-validation.war'
    webXml = file('webapp/WEB-INF/web.xml')
    classpath = configurations.dalRuntimeClasspath.filter { !it.name.startsWith('jakarta.servlet-api-') }
    classpath += sourceSets.bootstrap.output + sourceSets.web.output
    from(sourceSets.dal.output) {
        into 'WEB-INF/classes'
        exclude 'com/etendoerp/platform/validation/**'
    }
    from('fixtures/log4j2.xml') { into 'WEB-INF/classes' }
}

tasks.register('platformWar') { dependsOn war }

tasks.register('verifyClassicModel', JavaExec) {
    group = 'verification'
    description = 'Read the existing Classic dictionary with its generated entity classes.'
    dependsOn 'verifyClassicDatabase', classicGeneratedClasses
    classpath = sourceSets.classicGenerated.output + sourceSets.classicProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.ClassicModelValidation'
    workingDir = projectDir
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    doFirst { args file(project.property('classicProperties')).absolutePath }
}

tasks.register('generateClassicEntities', JavaExec) {
    dependsOn 'verifyClassicDatabase', classicProbeClasses, prepareGeneratorTemplates
    classpath = sourceSets.classicProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.ClassicModelValidation'
    workingDir = projectDir
    systemProperty 'validation.generateClassic', 'true'
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    doFirst { args file(project.property('classicProperties')).absolutePath }
}

tasks.register('verifyClassicDal', JavaExec) {
    group = 'verification'
    description = 'Start the actual DAL against Classic and verify read-only Product HQL.'
    dependsOn 'verifyClassicDatabase', classicGeneratedClasses
    classpath = sourceSets.classicGenerated.output + sourceSets.classicProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.ClassicModelValidation'
    workingDir = projectDir
    systemProperty 'validation.classicDal', 'true'
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    doFirst { args file(project.property('classicProperties')).absolutePath }
}

tasks.named('compileClassicGeneratedJava') { dependsOn 'generateClassicEntities' }
tasks.named('processClassicGeneratedResources') { dependsOn 'generateClassicEntities' }

tasks.register('verifyClassicDatabase', JavaExec) {
    group = 'verification'
    description = 'Check an existing Classic PostgreSQL database without modifying it.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.ClassicDatabaseValidation'
    workingDir = projectDir
    doFirst {
        if (!project.hasProperty('classicProperties')) {
            throw new GradleException('Supply -PclassicProperties=/absolute/path/to/Openbravo.properties')
        }
        args file(project.property('classicProperties')).absolutePath
    }
}

tasks.register('verifyTomcat', JavaExec) {
    group = 'verification'
    description = 'Deploy the WAR in isolated Tomcat and verify real OBDal over HTTP.'
    dependsOn platformWar, tomcatProbeClasses
    classpath = sourceSets.dictionaryProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.DictionaryValidation'
    workingDir = projectDir
    systemProperty 'validation.security', 'true'
    systemProperty 'validation.obdal', 'true'
    systemProperty 'validation.tomcat', 'true'
    systemProperty 'validation.tomcatClasspath', sourceSets.tomcatProbe.runtimeClasspath.asPath
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    outputs.upToDateWhen { false }
}

tasks.register('verifyPersistenceFoundation', JavaExec) {
    group = 'verification'
    description = 'Verify XML/PostgreSQL/Hibernate in a disposable database without ERP classes.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.PersistenceValidation'
    workingDir = projectDir
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    outputs.upToDateWhen { false }
}

tasks.register('prepareGeneratorTemplates', Copy) {
    from('../src') { include 'org/openbravo/base/gen/*.ftl' }
    into layout.buildDirectory.dir('generator-input')
}

tasks.register('verifyDictionaryBootstrap', JavaExec) {
    group = 'verification'
    description = 'Read real dictionary metadata and generate entity sources in disposable PostgreSQL.'
    dependsOn dictionaryProbeClasses, bootstrapClasses, prepareGeneratorTemplates
    classpath = sourceSets.dictionaryProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.DictionaryValidation'
    workingDir = projectDir
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    outputs.upToDateWhen { false }
}

tasks.register('verifySecurityGeneration', JavaExec) {
    group = 'verification'
    description = 'Generate selected real security and Warehouse entities from the source dictionary.'
    dependsOn dictionaryProbeClasses, bootstrapClasses, prepareGeneratorTemplates
    classpath = sourceSets.dictionaryProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.DictionaryValidation'
    workingDir = projectDir
    systemProperty 'validation.security', 'true'
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    outputs.upToDateWhen { false }
}

tasks.register('verifyDalMappings', JavaExec) {
    group = 'verification'
    description = 'Bootstrap the real DAL SessionFactory with generated mappings and entity classes.'
    dependsOn dalClasses
    classpath = sourceSets.dictionaryProbe.runtimeClasspath + sourceSets.dal.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.DictionaryValidation'
    workingDir = projectDir
    systemProperty 'validation.security', 'true'
    systemProperty 'validation.dal', 'true'
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    outputs.upToDateWhen { false }
}

tasks.register('verifyOBDal', JavaExec) {
    group = 'verification'
    description = 'Verify OBDal persistence with a real security context and explicit table grants.'
    dependsOn dalClasses
    classpath = sourceSets.dictionaryProbe.runtimeClasspath + sourceSets.dal.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.DictionaryValidation'
    workingDir = projectDir
    systemProperty 'validation.security', 'true'
    systemProperty 'validation.dal', 'true'
    systemProperty 'validation.obdal', 'true'
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    outputs.upToDateWhen { false }
}

tasks.register('verifyPlatform', JavaExec) {
    group = 'verification'
    description = 'Verify the complete disposable platform lifecycle, including generated DAL v1/v2.'
    dependsOn dalClasses
    classpath = sourceSets.dictionaryProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.DictionaryValidation'
    workingDir = projectDir
    systemProperty 'validation.security', 'true'
    systemProperty 'validation.obdal', 'true'
    systemProperty 'validation.upgrade', 'true'
    systemProperty 'validation.dalClasspath', sourceSets.dal.runtimeClasspath.asPath
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
    outputs.upToDateWhen { false }
}
