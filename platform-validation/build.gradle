plugins {
    id 'java'
    id 'war'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main.java.srcDirs = ['src']
configurations { erpUiContainerRuntime }

// Compile the actual dictionary bootstrap separately from the ERP application.
sourceSets {
    classicEntities {
        java.srcDirs = ['../src-gen']
        resources {
            srcDir '../modules_core/org.openbravo.userinterface.selector/src'
            include '**/domaintype/*.hbm.xml'
        }
    }
    classicProbe {
        java.srcDirs = ['classic-probe']
        java.exclude 'LegacyContextCaller.java'
    }
    classicJson {
        java {
            srcDir '../modules_core/org.openbravo.client.application/src'
            srcDir '../modules_core/org.openbravo.service.datasource/src'
            srcDir '../modules_core/org.openbravo.service.json/src'
            srcDir '../modules_core/org.openbravo.client.kernel/src'
            include 'org/openbravo/service/datasource/DefaultDataSourceService.java'
            include 'org/openbravo/service/datasource/BaseDataSourceService.java'
            include 'org/openbravo/service/datasource/DataSourceConstants.java'
            include 'org/openbravo/service/datasource/DataSourceServlet.java'
            include 'org/openbravo/service/json/DefaultJsonDataService.java'
            include 'org/openbravo/service/json/AdvancedQueryBuilder.java'
            include 'org/openbravo/client/kernel/KernelUtils.java'
            include 'org/openbravo/client/application/window/ApplicationDictionaryCachedStructures.java'
        }
    }
    classicServiceProbe { java.srcDirs = ['classic-service-probe'] }
    compatWeb { java.srcDirs = ['compat-web'] }
    classicGenerated {
        java.srcDirs = ['build/classic-generated-entities']
        resources {
            srcDir 'build/classic-generated-entities'
            include 'META-INF/services/*'
        }
    }
    web {
        java.srcDirs = ['web']
    }
    tomcatProbe {
        java.srcDirs = ['tomcat-probe']
    }
    bootstrap {
        java {
            srcDir '../src'
            include 'org/openbravo/base/model/ModelProvider.java'
            include 'org/openbravo/base/model/domaintype/TableDirDomainType.java'
            include 'org/openbravo/base/model/domaintype/BooleanDomainType.java'
            include 'org/openbravo/base/model/domaintype/DatetimeDomainType.java'
            include 'org/openbravo/base/model/domaintype/StringEnumerateDomainType.java'
            include 'org/openbravo/base/model/domaintype/TableDomainType.java'
            include 'org/openbravo/base/session/DalUUIDGenerator.java'
            include 'org/openbravo/base/gen/GenerateEntitiesTask.java'
        }
        resources {
            srcDir '../src'
            include 'org/openbravo/base/model/*.hbm.xml'
            include 'org/openbravo/base/gen/*.ftl'
            include 'com/etendoerp/sequences/model/*.hbm.xml'
            include 'org/openbravo/dal/core/template*.hbm.xml'
        }
    }
    dictionaryProbe {
        java.srcDirs = ['dictionary-probe']
        compileClasspath += sourceSets.main.output + sourceSets.bootstrap.output
        runtimeClasspath += sourceSets.main.output + sourceSets.bootstrap.output
    }
    dal {
        java {
            srcDir '../src'
            srcDir 'build/security-generated-entities'
            srcDir 'dal-probe'
            include 'DalMappingValidation.java'
            include 'org/openbravo/dal/service/OBDal.java'
            include 'org/openbravo/dal/core/DalMappingGenerator.java'
            include 'org/openbravo/dal/core/DalSessionFactoryController.java'
            include 'com/etendoerp/sequences/services/*.java'
            include 'org/openbravo/model/**/*.java'
            include 'org/openbravo/client/application/*.java'
            include 'com/etendoerp/platform/fixture/*.java'
        }
        compileClasspath += sourceSets.bootstrap.output
        runtimeClasspath += sourceSets.bootstrap.output
        resources {
            srcDir 'build/security-generated-entities'
            include 'META-INF/services/*'
        }
    }
}

sourceSets.web.compileClasspath += sourceSets.bootstrap.output + sourceSets.dal.output
tasks.register('verifyEntityMetadata', JavaExec) {
    group = 'verification'
    description = 'Verify identifier metadata without loading the UI kernel or a database.'
    dependsOn dictionaryProbeClasses
    classpath = sourceSets.dictionaryProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.EntityMetadataValidation'
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
}
sourceSets.classicEntities.compileClasspath += sourceSets.bootstrap.output
sourceSets.classicProbe.compileClasspath += sourceSets.bootstrap.output + sourceSets.classicEntities.output
sourceSets.classicProbe.runtimeClasspath += sourceSets.classicEntities.output + sourceSets.bootstrap.output
configurations.classicEntitiesImplementation.extendsFrom(configurations.bootstrapImplementation)
configurations.classicProbeImplementation.extendsFrom(configurations.bootstrapImplementation)
configurations.classicProbeRuntimeOnly.extendsFrom(configurations.bootstrapRuntimeOnly)
configurations.classicProbeImplementation.extendsFrom(configurations.classicEntitiesImplementation)
configurations.classicGeneratedImplementation.extendsFrom(configurations.classicEntitiesImplementation)
sourceSets.classicGenerated.compileClasspath += sourceSets.bootstrap.output + sourceSets.classicEntities.output
sourceSets.classicJson.compileClasspath += sourceSets.classicGenerated.output + sourceSets.classicEntities.output + sourceSets.bootstrap.output
configurations.classicJsonImplementation.extendsFrom(configurations.classicEntitiesImplementation)
configurations.classicServiceProbeImplementation.extendsFrom(configurations.classicEntitiesImplementation)
configurations.classicServiceProbeRuntimeOnly.extendsFrom(configurations.bootstrapRuntimeOnly)
def classicServiceSupport = files('build/classic-compatibility/WEB-INF/classes') +
        fileTree('build/classic-compatibility/WEB-INF/lib') { include '*.jar' }
def classicServiceClasses = sourceSets.classicJson.output + sourceSets.classicGenerated.output +
        sourceSets.classicEntities.output + sourceSets.bootstrap.output + sourceSets.classicProbe.output
tasks.register('compileLegacyContextCaller', JavaCompile) {
    dependsOn 'prepareClassicCompatibility'
    source file('classic-probe/LegacyContextCaller.java')
    classpath = classicServiceSupport
    destinationDirectory = layout.buildDirectory.dir('legacy-caller')
    options.sourcepath = files()
    options.compilerArgs += ['-implicit:none']
}
tasks.register('verifyLegacyContextLinkage', JavaExec) {
    group = 'verification'
    dependsOn 'compileLegacyContextCaller', 'compileClassicJsonJava'
    classpath = files(layout.buildDirectory.dir('legacy-caller')) + classicServiceClasses +
            configurations.classicServiceProbeRuntimeClasspath + classicServiceSupport
    mainClass = 'com.etendoerp.platform.validation.LegacyContextCaller'
    systemProperty 'log4j2.configurationFile', file('fixtures/log4j2.xml').absolutePath
}
sourceSets.classicServiceProbe.compileClasspath += classicServiceClasses + classicServiceSupport
sourceSets.classicServiceProbe.runtimeClasspath += classicServiceClasses + classicServiceSupport
configurations.compatWebImplementation.extendsFrom(configurations.classicEntitiesImplementation)
sourceSets.compatWeb.compileClasspath += classicServiceClasses + classicServiceSupport
tasks.named('compileCompatWebJava') { dependsOn 'compileClassicJsonJava' }

tasks.register('compatibilityWar', War) {
    group = 'build'
    description = 'Package the existing Product service behind the platform-only web lifecycle.'
    dependsOn compatWebClasses, 'compileClassicJsonJava', 'prepareClassicCompatibility'
    archiveFileName = 'platform-compatibility.war'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    webXml = file('compat-web/web.xml')
    classpath = files()
    from(sourceSets.compatWeb.output) { into 'WEB-INF/classes' }
    from(sourceSets.classicJson.output) { into 'WEB-INF/classes' }
    from(sourceSets.classicGenerated.output) { into 'WEB-INF/classes' }
    from(sourceSets.classicEntities.output) { into 'WEB-INF/classes' }
    from(sourceSets.bootstrap.output) { into 'WEB-INF/classes' }
    from('fixtures/log4j2.xml') { into 'WEB-INF/classes' }
    from('build/classic-compatibility/WEB-INF/classes') {
        into 'WEB-INF/classes'
        exclude '**/*.properties', '**/log4j*.xml', '**/beans.xml'
    }
    from(configurations.classicServiceProbeRuntimeClasspath.filter { !it.name.startsWith('jakarta.servlet-api-') }) {
        into 'WEB-INF/lib'
    }
    from('build/classic-compatibility/WEB-INF/lib') {
        into 'WEB-INF/lib'
        exclude '*servlet-api*', 'log4j-core-*', 'log4j-api-*', 'log4j-1.2-api-*', 'hibernate-core-*', 'postgresql-*'
    }
}
configurations.bootstrapImplementation.extendsFrom(configurations.implementation)
tasks.register('erpHeadlessWar', Zip) {
    group = 'build'
    description = 'Assemble an experimental ERP REST distribution with explicit UI compatibility types.'
    dependsOn 'compatibilityWar'
    // Closure-based exclusions must invalidate the archive when the policy changes.
    inputs.file(buildFile)
    archiveFileName = 'platform-erp-headless.war'
    destinationDirectory = layout.buildDirectory.dir('libs')
    def compatibilityTypes = [
        'org/openbravo/client/application/CachedPreference',
        'org/openbravo/client/application/window/ApplicationDictionaryCachedStructures',
        'org/openbravo/client/kernel/KernelUtils',
        'org/openbravo/client/kernel/KernelUtilsData',
        'org/openbravo/client/kernel/RequestContext',
        'org/openbravo/userinterface/selector/SelectorConstants'
    ]
    from(provider { zipTree(tasks.compatibilityWar.archiveFile.get().asFile) }) {
        exclude { details ->
            def path = details.path
            if (!path.startsWith('WEB-INF/classes/')) return false
            def type = path.substring('WEB-INF/classes/'.length())
            if (type.startsWith('com/etendoerp/client/application/') ||
                    type.startsWith('com/smf/smartclient/') ||
                    type.startsWith('com/smf/userinterface/')) return true
            if (type ==~ /.*ComponentProvider(?:\$.*)?\.class/) return true
            if (type.startsWith('org/openbravo/service/datasource/DataSourceServlet')) return true
            if (type.startsWith('org/openbravo/erpCommon/ad_forms/') ||
                    type.startsWith('org/openbravo/erpCommon/ad_reports/')) return true
            if (!(type.startsWith('org/openbravo/client/') ||
                    type.startsWith('org/openbravo/userinterface/'))) return false
            if (file("build/classes/java/classicGenerated/${type}").isFile()) return false
            if (type.startsWith('org/openbravo/userinterface/selector/model/domaintype/')) return false
            return !compatibilityTypes.any { allowed ->
                type == allowed + '.class' || type.startsWith(allowed + '$')
            }
        }
    }
}

tasks.register('runErpHeadless', JavaExec) {
    group = 'application'
    description = 'Run the experimental ERP REST assembly with read-only database access.'
    dependsOn 'verifyErpHeadlessPackaging', tomcatProbeClasses
    classpath = sourceSets.tomcatProbe.runtimeClasspath
    mainClass = 'com.etendoerp.platform.validation.CompatibilityServer'
    workingDir = projectDir
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED'
    doFirst {
        args file('build/libs/platform-erp-headless.war').absolutePath,
                file(project.property('classicProperties')).absolutePath,
                project.findProperty('platformPort') ?: '8094'
    }
}

tasks.register('verifyErpHeadlessPackaging') {
    group = 'verification'
    description = 'Reject known UI entry points and web assets in the ERP REST candidate.'
    dependsOn 'erpHeadlessWar'
    doLast {
        def warFile = tasks.erpHeadlessWar.archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(warFile)
        try {
            ['org/openbravo/client/kernel/KernelServlet',
             'org/openbravo/client/kernel/BaseKernelServlet',
             'org/openbravo/client/kernel/BaseTemplateComponent',
             'org/openbravo/service/datasource/DataSourceServlet'].each { type ->
                if (zip.getEntry("WEB-INF/classes/${type}.class") != null) {
                    throw new GradleException("UI entry point packaged in ERP REST: ${type}")
                }
            }
            zip.entries().each { entry ->
                if (!entry.directory && !entry.name.startsWith('WEB-INF/') &&
                        !entry.name.startsWith('META-INF/')) {
                    throw new GradleException("Public web asset packaged in ERP REST: ${entry.name}")
                }
            }
            ['org/openbravo/dal/service/OBDal',
             'org/openbravo/service/datasource/DefaultDataSourceService',
             'com/etendoerp/platform/compat/ProductServlet'].each { type ->
                if (zip.getEntry("WEB-INF/classes/${type}.class") == null) {
                    throw new GradleException("Required ERP REST implementation missing: ${type}")
                }
            }
            logger.lifecycle('PASS: ERP REST candidate has original services without UI entry points or public assets')
        } finally { zip.close() }
    }
}

tasks.register('verifyPlatformNestedBoundary', JavaExec) {
    group = 'verification'
    dependsOn 'platformWar', 'verifyWarBoundaryRules', tomcatProbeClasses
    classpath = sourceSets.tomcatProbe.runtimeClasspath
