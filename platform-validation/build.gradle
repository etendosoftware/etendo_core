tasks.register('erpUiWar', Zip) {
    group = 'build'
    description = 'Assemble the existing ERP UI with refactored shared motor classes, without properties.'
    dependsOn 'compileClassicJsonJava', 'compileClassicGeneratedJava', ':platform-core:jar'
